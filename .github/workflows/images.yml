# Builds and verifies every image in boards.conf. Called by build.yml and
# release.yml.
name: Images

on:
  workflow_call:
    inputs:
      version:
        description: Version string for the image file names
        type: string
        required: true
      from_source:
        description: Build kernel, U-Boot and every other artifact here instead of taking Armbian's cached builds
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.boards.outputs.include }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: boards
        name: Read boards.conf
        run: |
          include="$(awk '!/^[[:space:]]*(#|$)/ { printf "%s{\"board\":\"%s\",\"branch\":\"%s\",\"release\":\"%s\",\"flavor\":\"%s\",\"suffix\":\"%s\"}", (n++ ? "," : ""), $1, $2, $3, $4, ($4 == "cli" ? "" : "-" $4) }' boards.conf)"
          echo "include=[${include}]" >> "$GITHUB_OUTPUT"
          echo "[${include}]"

  image:
    needs: matrix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      # Values from boards.conf and the caller reach the shell as variables,
      # never pasted into the script text.
      BOARD: ${{ matrix.board }}
      BRANCH: ${{ matrix.branch }}
      RELEASE: ${{ matrix.release }}
      FLAVOR: ${{ matrix.flavor }}
      VERSION: ${{ inputs.version }}
      FROM_SOURCE: ${{ inputs.from_source }}
      # A desktop image has its flavor in the name; a command line image
      # (cli) has none.
      NAME: roxora-${{ matrix.board }}-${{ matrix.release }}-${{ matrix.branch }}${{ matrix.suffix }}-${{ inputs.version }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Boot method
        # UEFI images (userpatches/roxora/uefi/board.inc) carry no U-Boot.
        run: |
          uefi=no
          grep -qs 'roxora/uefi/board.inc' "userpatches/config/boards/${BOARD}.conf" && uefi=yes
          echo "UEFI=${uefi}" >> "$GITHUB_ENV"
          echo "${BOARD}: UEFI=${uefi}"

      - name: Build
        id: build
        run: |
          extra=()
          # Releases build everything here; other runs may reuse Armbian's
          # cached kernel, U-Boot and rootfs builds from ghcr.io.
          [[ "${FROM_SOURCE}" == true ]] && extra+=(ARTIFACT_IGNORE_CACHE=yes)
          ./build.sh "BOARD=${BOARD}" "BRANCH=${BRANCH}" "RELEASE=${RELEASE}" "FLAVOR=${FLAVOR}" \
            "VERSION=${VERSION}" PREFER_DOCKER=no "${extra[@]}"
          ls -la output/
          df -h /

      - name: SPI bootloader
        # Boards whose U-Boot package carries an SPI NOR image (the ROCK 4D)
        # get it as a separate file, from the same build as the image.
        # UEFI images have none: the board's firmware is installed separately.
        run: |
          if [[ "${UEFI}" == yes ]]; then
            echo "${BOARD} is a UEFI image: no U-Boot, no SPI bootloader image"
            exit 0
          fi
          deb="$(find cache/armbian-build/output -name "linux-u-boot-${BOARD}-${BRANCH}_*.deb" | head -1)"
          [[ -n "${deb}" ]] || { echo "no U-Boot package found"; exit 1; }
          tmp="$(mktemp -d)"
          dpkg-deb -x "${deb}" "${tmp}"
          spi="$(find "${tmp}" -name u-boot-rockchip-spi.bin | head -1)"
          if [[ -n "${spi}" ]]; then
            cp "${spi}" "output/${NAME}-spi.img"
            (cd output && sha256sum "${NAME}-spi.img" > "${NAME}-spi.img.sha256")
            ls -la output/*-spi.img*
          else
            echo "${BOARD} has no SPI bootloader image"
          fi
          rm -rf "${tmp}"

      - name: Verify
        run: |
          set -o pipefail
          sudo verify/verify-image.sh --flavor "${FLAVOR}" "output/${NAME}.img.xz" | tee "output/${NAME}.verify.txt"
          df -h /

      - name: Boot in QEMU
        # UEFI images only: QEMU's arm64 virt machine with Ubuntu's edk2
        # (AAVMF) must start GRUB, and GRUB the kernel. Runs even when the
        # verify step failed, to show how far the image boots.
        if: ${{ !cancelled() && env.UEFI == 'yes' && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm qemu-efi-aarch64 > /dev/null
          # Rockchip's BSP kernel (vendor branch) has no driver for QEMU's
          # UART, so only GRUB and the kernel's EFI stub can be seen.
          stub=()
          [[ "${BRANCH}" == vendor* ]] && stub=(--stub-only)
          verify/qemu-boot.sh "${stub[@]}" "output/${NAME}.img.xz" "output/${NAME}.qemu-serial.log" | tee "output/${NAME}.qemu.txt"

      - name: Image details
        if: always()
        run: |
          cp /tmp/roxora-dpkg.txt "output/${NAME}.dpkg.txt" || true
          xz -l --robot "output/${NAME}.img.xz" | awk '$1 == "totals" { print $5 }' > "output/${NAME}.extract_size" || true
          xz -dc "output/${NAME}.img.xz" | sha256sum | cut -d' ' -f1 > "output/${NAME}.extract_sha256" || true
          grep -o 'in place for kernel [^;]*' "output/${NAME}.verify.txt" | head -1 | sed 's/in place for kernel //' > "output/${NAME}.kernel" || true
          cat output/*.extract_size output/*.kernel || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ env.NAME }}
          path: |
            output/${{ env.NAME }}.*
            output/${{ env.NAME }}-spi.img*
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-${{ env.NAME }}
          path: cache/armbian-build/output/logs/
