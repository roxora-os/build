name: Build

on:
  workflow_dispatch:
    inputs:
      from_source:
        description: Build everything from source, as a release does
        type: boolean
        default: false
      only:
        description: Only the boards.conf lines whose "board branch release flavor" matches this regular expression (empty for all)
        type: string
        default: ""
  pull_request:
    paths:
      - build.sh
      - armbian.ref
      - boards.conf
      - userpatches/**
      - verify/**
      - .github/workflows/build.yml
      - .github/workflows/images.yml

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/images.yml
    with:
      version: ci.${{ github.run_number }}
      from_source: ${{ inputs.from_source == true }}
      only: ${{ inputs.only || '' }}
