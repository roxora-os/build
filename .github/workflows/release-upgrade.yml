# Ubuntu release upgrades, 24.04 to 26.04 and 26.04 to 26.10: published
# images of an earlier release are first updated to this commit's release
# (verify/upgrade-test.sh), then upgraded with do-release-upgrade as
# docs/install.md says (verify/release-upgrade-test.sh), then checked with
# verify-image.sh --upgraded against the new release's expectations. The
# UEFI image is also booted in QEMU afterwards. All in a chroot or QEMU, not
# on a board.
name: Release upgrade

on:
  workflow_dispatch:
    inputs:
      from:
        description: Release tag of the 24.04 images
        type: string
        default: v2026.11.4
      from_resolute:
        description: Release tag of the 26.04 images
        type: string
        default: v2026.11.5
  push:
    paths:
      - userpatches/roxora/**
      - verify/**
      - docs/install.md
      - .github/workflows/release-upgrade.yml
  pull_request:
    paths:
      - userpatches/roxora/**
      - verify/**
      - docs/install.md
      - .github/workflows/release-upgrade.yml

permissions:
  contents: read

jobs:
  release-upgrade:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: noble, board: radxa-rock-4d, flavor: cli, suffix: "" }
          - { release: noble, board: generic-rk3576-uefi, flavor: cli, suffix: "" }
          - { release: noble, board: radxa-rock-4d, flavor: gnome-minimal, suffix: "-gnome-minimal" }
          - { release: noble, board: radxa-rock-4d, flavor: gnome, suffix: "-gnome" }
          # 2026.11.5 is the first release whose 26.04 images have the
          # release packages.
          - { release: resolute, board: radxa-rock-4d, flavor: cli, suffix: "" }
          - { release: resolute, board: generic-rk3576-uefi, flavor: cli, suffix: "" }
          - { release: resolute, board: radxa-rock-4d, flavor: gnome-minimal, suffix: "-gnome-minimal" }
    env:
      FROM: ${{ matrix.release == 'resolute' && (inputs.from_resolute || 'v2026.11.5') || (inputs.from || 'v2026.11.4') }}
      RELEASE: ${{ matrix.release }}
      BOARD: ${{ matrix.board }}
      FLAVOR: ${{ matrix.flavor }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends apt-utils snapd u-boot-tools xz-utils \
            qemu-system-arm qemu-efi-aarch64 > /dev/null

      - name: The release packages of this commit
        run: |
          for suite in $(awk '!/^[[:space:]]*(#|$)/ { print $1 }' userpatches/roxora/releases.conf); do
            userpatches/roxora/packages/build.sh --suite "${suite}" --flavor "${FLAVOR}" --out "release-debs/${suite}"
          done

      - name: The old image, updated to this commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          name="roxora-${BOARD}-${RELEASE}-edge${SUFFIX}-${FROM#v}"
          echo "OLD=${name}" >> "$GITHUB_ENV"
          gh release download "${FROM}" --repo roxora-os/build --dir old \
            --pattern "${name}.img.xz" --pattern "${name}.img.xz.part*" --pattern "${name}.img.xz.sha256"
          cd old
          if [[ ! -f "${name}.img.xz" ]]; then
            cat "${name}.img.xz.part"* > "${name}.img.xz"
            rm "${name}.img.xz.part"*
          fi
          sha256sum -c "${name}.img.xz.sha256"
          cd ..
          mkdir -p logs
          sudo verify/upgrade-test.sh --flavor "${FLAVOR}" --release-debs "release-debs/${RELEASE}" \
            "old/${name}.img.xz" upgraded.img | tee logs/upgrade.txt
          rm -rf old

      - name: do-release-upgrade
        run: |
          sudo verify/release-upgrade-test.sh --release-debs release-debs upgraded.img logs
          df -h /

      - name: Verify the result as a system of the new release
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          sudo verify/verify-image.sh --upgraded --flavor "${FLAVOR}" upgraded.img | sudo tee logs/verify.txt

      - name: Boot in QEMU
        if: ${{ !cancelled() && matrix.board == 'generic-rk3576-uefi' }}
        run: |
          set -o pipefail
          verify/qemu-boot.sh upgraded.img logs/qemu-serial.log | sudo tee logs/qemu.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-upgrade-${{ matrix.release }}-${{ matrix.board }}-${{ matrix.flavor }}
          path: logs/
          if-no-files-found: ignore
