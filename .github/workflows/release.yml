name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        name: Check the tag format (vYYYY.MM.N)
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v([0-9]{4}\.[0-9]{2}\.[0-9]+)$ ]] || { echo "tag ${tag} is not vYYYY.MM.N"; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  images:
    needs: check
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: roxora-*
          merge-multiple: true
      - name: Catalog, checksums and notes
        run: |
          python3 .github/scripts/catalog.py make --dir artifacts --tag "${GITHUB_REF_NAME}" \
            --boards boards.conf --ref armbian.ref > artifacts/roxora-catalog.json
          python3 .github/scripts/catalog.py notes --catalog artifacts/roxora-catalog.json > notes.md
          mkdir release
          cp artifacts/*.img.xz artifacts/*.img.xz.sha256 artifacts/*.verify.txt artifacts/roxora-catalog.json release/
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -la release
          cat notes.md
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every new release is a pre-release until hardware-test.md has
          # passed on its boards; mark-tested.yml changes that.
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease \
            --title "Roxora ${{ needs.check.outputs.version }}" --notes-file notes.md
