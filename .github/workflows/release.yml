name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      beta: ${{ steps.tag.outputs.beta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: tag
        name: Check the tag format (vYYYY.MM.N, or vYYYY.MM.N-beta.N for a beta)
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v([0-9]{4}\.[0-9]{2}\.[0-9]+(-beta\.[0-9]+)?)$ ]] ||
            { echo "tag ${tag} is not vYYYY.MM.N or vYYYY.MM.N-beta.N"; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then echo "beta=true"; else echo "beta=false"; fi >> "$GITHUB_OUTPUT"
      - name: Check the release packages' version
        # The images carry roxora-release of ROXORA_RELEASE
        # (userpatches/roxora/roxora-repo.conf), and roxora-os/apt publishes
        # it from this tag: it must be the tag's version (a beta's -beta.N is
        # ~beta.N there, so that it sorts before the release).
        run: |
          version="${GITHUB_REF_NAME#v}"
          want="${version/-beta./~beta.}"
          have="$(sed -n 's/^ROXORA_RELEASE=//p' userpatches/roxora/roxora-repo.conf)"
          [[ "${have}" == "${want}" ]] ||
            { echo "::error::ROXORA_RELEASE is '${have}' in userpatches/roxora/roxora-repo.conf; tag ${GITHUB_REF_NAME} needs '${want}'"; exit 1; }
          echo "release packages ${have}"

  images:
    needs: check
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.check.outputs.version }}
      from_source: true

  publish:
    needs: [check, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance attestations (actions/attest-build-provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: roxora-*
          merge-multiple: true
      # A signed statement of which workflow run, commit and repository built
      # each release file; check one with
      # gh attestation verify <file> --repo roxora-os/build
      # The images are attested whole, before the large ones are split, so
      # the statement also holds for a file joined from its parts.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/*.img.xz
            artifacts/*-spi.img
      - name: Split large images, catalog, checksums and notes
        run: |
          # GitHub takes no release file of 2 GiB or more: images over
          # 1900 MiB go out as <file>.part1, <file>.part2, ... and the
          # catalog lists the parts (docs/release-contract.md).
          python3 .github/scripts/catalog.py split --dir artifacts
          python3 .github/scripts/catalog.py make --dir artifacts --tag "${GITHUB_REF_NAME}" \
            --boards boards.conf --ref armbian.ref > artifacts/roxora-catalog.json
          python3 .github/scripts/catalog.py notes --catalog artifacts/roxora-catalog.json > notes.md
          mkdir release
          # Moved, not copied: the images are some 35 GB together.
          mv artifacts/*.img.xz artifacts/*.img.xz.sha256 artifacts/*.verify.txt artifacts/roxora-catalog.json release/
          mv artifacts/*.img.xz.part* release/ 2> /dev/null || true
          mv artifacts/*-spi.img artifacts/*-spi.img.sha256 release/ 2> /dev/null || true
          # No file may reach the upload at or over the limit.
          big="$(find release -type f -size +2047M)"
          [[ -z "${big}" ]] || { echo "too large for a release file: ${big}"; exit 1; }
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -la release
          df -h .
          cat notes.md
      # The same statement for the parts, the catalog and the checksums.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/*.img.xz.part*
            release/roxora-catalog.json
            release/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ needs.check.outputs.beta }}
        run: |
          # Images that passed the checks in CI (and the QEMU boot for UEFI
          # images) make a release; a -beta.N tag makes a GitHub
          # pre-release. Which images were tested on a board is in the
          # catalog and the notes (mark-tested.yml).
          beta=()
          [[ "${BETA}" == true ]] && beta=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag "${beta[@]}" \
            --title "Roxora ${{ needs.check.outputs.version }}" --notes-file notes.md

      # A release created with GITHUB_TOKEN starts no other workflow, so
      # notify-site.yml does not see it; tell the website here instead.
      - name: Tell the website to rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; the site picks the release up at its next hourly build."
            exit 0
          fi
          gh api repos/roxora-os/roxora-os.github.io/dispatches \
            -f event_type=build-updated -F "client_payload[source]=release ${GITHUB_REF_NAME}"

      # The apt repository builds this release's packages from the tag. Its
      # hourly schedule picks the release up too, but GitHub runs it only
      # every few hours; tell it here. A token without access to
      # roxora-os/apt only leaves a notice: the release is out either way.
      - name: Tell the apt repository
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; roxora-os/apt picks the release up at its next scheduled run."
            exit 0
          fi
          gh api repos/roxora-os/apt/dispatches \
            -f event_type=build-release -F "client_payload[tag]=${GITHUB_REF_NAME}" ||
            echo "::notice::Could not notify roxora-os/apt (the token may not have access to it); it picks the release up at its next scheduled run."
