name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      beta: ${{ steps.tag.outputs.beta }}
    steps:
      - id: tag
        name: Check the tag format (vYYYY.MM.N, or vYYYY.MM.N-beta.N for a beta)
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v([0-9]{4}\.[0-9]{2}\.[0-9]+(-beta\.[0-9]+)?)$ ]] ||
            { echo "tag ${tag} is not vYYYY.MM.N or vYYYY.MM.N-beta.N"; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then echo "beta=true"; else echo "beta=false"; fi >> "$GITHUB_OUTPUT"

  images:
    needs: check
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.check.outputs.version }}
      from_source: true

  publish:
    needs: [check, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance attestations (actions/attest-build-provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: roxora-*
          merge-multiple: true
      - name: Catalog, checksums and notes
        run: |
          python3 .github/scripts/catalog.py make --dir artifacts --tag "${GITHUB_REF_NAME}" \
            --boards boards.conf --ref armbian.ref > artifacts/roxora-catalog.json
          python3 .github/scripts/catalog.py notes --catalog artifacts/roxora-catalog.json > notes.md
          mkdir release
          cp artifacts/*.img.xz artifacts/*.img.xz.sha256 artifacts/*.verify.txt artifacts/roxora-catalog.json release/
          cp artifacts/*-spi.img artifacts/*-spi.img.sha256 release/ 2> /dev/null || true
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -la release
          cat notes.md
      # A signed statement of which workflow run, commit and repository built
      # each release file; check one with
      # gh attestation verify <file> --repo roxora-os/build
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/*.img.xz
            release/*-spi.img
            release/roxora-catalog.json
            release/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ needs.check.outputs.beta }}
        run: |
          # Images that passed the checks in CI (and the QEMU boot for UEFI
          # images) make a release; a -beta.N tag makes a GitHub
          # pre-release. Which images were tested on a board is in the
          # catalog and the notes (mark-tested.yml).
          beta=()
          [[ "${BETA}" == true ]] && beta=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag "${beta[@]}" \
            --title "Roxora ${{ needs.check.outputs.version }}" --notes-file notes.md

      # A release created with GITHUB_TOKEN starts no other workflow, so
      # notify-site.yml does not see it; tell the website here instead.
      - name: Tell the website to rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; the site picks the release up at its next hourly build."
            exit 0
          fi
          gh api repos/roxora-os/roxora-os.github.io/dispatches \
            -f event_type=build-updated -F "client_payload[source]=release ${GITHUB_REF_NAME}"
