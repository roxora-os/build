# Supported build combinations.
#
# One line per image. Columns are separated by whitespace:
#
#   BOARD     Armbian board name (config/boards/<BOARD>.conf or .csc), or a
#             Roxora UEFI image (userpatches/config/boards/generic-<soc>-uefi.conf)
#   BRANCH    Armbian kernel branch
#   RELEASE   Ubuntu release codename
#   STATUS    hardware-tested: a maintainer ran docs/hardware-test.md on the board
#             ci-only: the image builds and passes verify/verify-image.sh in CI
#   SOC       SoC name, lower case
#   VENDOR    board maker as people write it, one word
#   NAME      board name for people, with the vendor (rest of the line);
#             for a UEFI image, the boards it is for (VENDOR is Generic)
#
# build.sh, the CI matrix and the website all read this file.

# BOARD          BRANCH  RELEASE  STATUS   SOC     VENDOR  NAME
radxa-rock-4d    edge    noble    ci-only  rk3576  Radxa   Radxa ROCK 4D
armsom-cm5-io    edge    noble    ci-only  rk3576  ArmSoM  ArmSoM CM5-IO
radxa-rock-4d    edge    resolute ci-only  rk3576  Radxa   Radxa ROCK 4D
armsom-cm5-io    edge    resolute ci-only  rk3576  ArmSoM  ArmSoM CM5-IO
generic-rk3576-uefi edge    noble    ci-only  rk3576  Generic RK3576 boards with UEFI firmware
generic-rk3576-uefi edge    resolute ci-only  rk3576  Generic RK3576 boards with UEFI firmware
generic-rk3576-uefi vendor  noble    ci-only  rk3576  Generic RK3576 boards with UEFI firmware
generic-rk3576-uefi vendor  resolute ci-only  rk3576  Generic RK3576 boards with UEFI firmware
