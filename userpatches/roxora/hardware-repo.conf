# The apt repository the hardware-layer packages (kernel, kernel headers,
# device tree, U-Boot, firmware) are installed and updated from. Moving them
# to another repository is a change to this file only: the extension writes
# the source list and the apt pin from it, and verify/verify-image.sh checks
# the image against it.
#
# HW_REPO=armbian keeps the source list Armbian's build writes,
# /etc/apt/sources.list.d/armbian.sources (apt.armbian.com).
# Any other value writes /etc/apt/sources.list.d/roxora-hardware.sources from
# the HW_REPO_* fields below, installs HW_REPO_KEY, and removes armbian.sources.

HW_REPO=armbian

# Origin field of the repository's Release file; the apt pin matches on it.
HW_REPO_ORIGIN=Armbian

# Host name the repository is served from; apt names its package lists after it.
HW_REPO_HOST=apt.armbian.com

# Only used when HW_REPO is not "armbian".
HW_REPO_URI=
HW_REPO_SUITES=noble
HW_REPO_COMPONENTS=main
# Key file under userpatches/roxora/apt/, installed to /usr/share/keyrings/.
HW_REPO_KEY=
