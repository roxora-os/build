# Installed by Roxora on desktop images. NetworkManager runs the network, as
# on an Ubuntu desktop: ubuntu-settings ships the netplan file that makes it
# the renderer for every device (/usr/lib/netplan/00-network-manager-all.yaml).
# cloud-init writes no network configuration of its own, which would hand the
# wired interface to systemd-networkd.
network:
  config: disabled
