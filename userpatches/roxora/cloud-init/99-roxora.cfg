# Installed by Roxora. The image carries its own NoCloud seed in
# /var/lib/cloud/seed/nocloud. A filesystem labelled CIDATA (for example a USB
# stick with user-data and meta-data on it) is also read at first boot.
datasource_list: [ NoCloud, None ]

# A swap file, made at the first boot by cloud-init's mounts module once the
# root file system has grown. "auto" sizes it like this: as large as the
# memory below 4 GiB of memory, 4 GiB from 4 to 16 GiB, and never more than a
# quarter of the free space or twice the memory. hwtool swap changes or
# removes it later.
swap:
  filename: /swap.img
  size: auto
