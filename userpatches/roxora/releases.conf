# The Ubuntu releases Roxora knows. One line per release, columns separated
# by whitespace:
#
#   CODENAME  Ubuntu codename, the RELEASE column of boards.conf
#   VERSION   Ubuntu version
#   PREVIOUS  the release a release upgrade to this one comes from ("-": none)
#   ARMBIAN   the release of Armbian's that the image's hardware layer comes
#             with: the suite of the hardware repository (hardware-repo.conf)
#             its kernel, device tree, U-Boot and firmware packages come
#             from. Those packages do not depend on the Ubuntu release. It is
#             CODENAME itself where Armbian has the release; where it is
#             another release, Armbian's build does not know CODENAME, and
#             Roxora supplies the release definition
#             (distributions/<CODENAME>, see docs/architecture.md).
#
# build.sh, the extension, packages/build.sh, verify/verify-image.sh and the
# release catalog read this file.

# CODENAME  VERSION  PREVIOUS  ARMBIAN
noble       24.04    -         noble
resolute    26.04    noble     resolute
