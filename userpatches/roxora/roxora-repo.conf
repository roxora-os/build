# shellcheck shell=bash disable=SC2034
# Roxora's apt repository (https://github.com/roxora-os/apt) and the
# versions of Roxora's packages an image built from this commit installs
# from it. verify/verify-image.sh checks the image against this file.

# The repository and its signing key. The image's apt source,
# /etc/apt/sources.list.d/roxora.sources, names this URL with the image's
# Ubuntu release as the suite; the apt pin (apt/roxora.pref) matches the
# host, and takes nothing but roxora-* packages from there.
ROXORA_REPO_URI=https://roxora-os.github.io/apt
ROXORA_REPO_HOST=roxora-os.github.io
# Origin field of its Release files; verify-image.sh reads apt's upgrade
# plan by it.
ROXORA_REPO_ORIGIN=Roxora
ROXORA_REPO_KEY_FINGERPRINT=07353CCFAF21725418E3CE4798FC2BE6A9A8952D

# The Roxora release this commit's release packages (roxora-release and the
# flavor package) are, built here by packages/build.sh. Their version is
# this, "+" and the Ubuntu version: 2026.11.5+24.04. A release tag
# vYYYY.MM.N must equal it (release.yml checks); once released, the next
# change to the packages needs the next version.
ROXORA_RELEASE=2026.11.5

# Installed from the repository at exactly these versions.
HWTOOL_VERSION=0.3.0
WALLPAPERS_VERSION=1.0+git4dcd145
KEYRING_VERSION=2026.11.15
