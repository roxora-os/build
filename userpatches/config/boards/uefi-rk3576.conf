#
# Roxora: one image for every RK3576 board that runs UEFI firmware, such as
# edk2-rk3576 (https://github.com/gahingwoo/edk2-rk3576). No U-Boot in the
# image; the firmware starts GRUB and gives the kernel its device tree.
# The rest is shared by all UEFI boards: userpatches/roxora/uefi/board.inc.
declare -g BOARD_NAME="RK3576 UEFI"
declare -g BOARDFAMILY="rk35xx"
declare -g BOOT_SOC="rk3576"
# Kernel console on the SoC's debug UART, as GRUB passes it to the kernel.
declare -g ROXORA_UEFI_SERIAL="ttyS0,1500000n8"

# shellcheck source=userpatches/roxora/uefi/board.inc
source "${USERPATCHES_PATH}/roxora/uefi/board.inc"
